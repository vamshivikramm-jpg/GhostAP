name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff pip-audit
      - name: Lint (ruff, incl. security rules)
        run: ruff check .
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Evaluation smoke test
        run: |
          python tools/make_eval_set.py
          python evaluate.py --dataset data/eval --out results --no-charts
      - name: Numbers quoted in the docs match the results
        run: python tools/sync_numbers.py

  docker:
    # Builds the image from Dockerfile and checks that the dashboard answers inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghostap:ci .
      - name: Start the demo container and wait for the dashboard
        run: |
          docker run -d --name ghostap-ci -p 127.0.0.1:8050:8050 -e GHOSTAP_TOKEN=ci-only-token \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true ghostap:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8050/api/login/state >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8050/api/login/state
          docker exec ghostap-ci python -m ghostap.healthcheck 8050
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8050/api/summary)" = 401
          curl -fsS -H "Authorization: Bearer ci-only-token" http://127.0.0.1:8050/api/summary
      - name: Container logs
        if: always()
        run: docker logs ghostap-ci || true
