# GhostAP risk engine configuration (Phase 4)
#
# Risk score:  R = sum(w_i * x_i) / sum(w_i) * 100     (x_i = indicator value in [0, 1])

# First N minutes of a capture are used to learn what "normal" looks like.
baseline_minutes: 2

# Indicator weights: higher = more evidence of an evil twin.
weights:
  security_downgrade: 3.0        # WPA2 -> open is the classic evil-twin give-away
  new_bssid_oui: 2.0             # unknown radio vendor for a known network
  tsf_anomaly: 2.0               # freshly booted device / TSF reset
  ie_fingerprint: 2.5            # beacon built by different hardware / AP software
  bssid_conflict: 2.5            # cloned BSSID: hard to explain benignly
  rssi_jump: 1.5                 # attacker usually sits close to the victim
  channel_deviation: 1.0         # common for legit multi-AP networks too
  beacon_interval_mismatch: 1.0  # different hardware / software AP

# Risk levels on the smoothed score (0-100).
thresholds:
  medium: 30   # score >= 30 -> MEDIUM (an alert is raised)
  high: 60     # score >= 60 -> HIGH

# Temporal analysis.
temporal:
  step_seconds: 10      # evaluate every AP every 10 s of capture time
  window_seconds: 10    # indicators use only the frames from the last 10 s
  smoothing_steps: 3    # smoothed score = mean of the last 3 raw scores
                        # (0 when the AP was not seen), so a one-off spike
                        # contributes at most 1/3 of its value

# BSSIDs the network administrator knows are legitimate (lower case). An
# allow-listed BSSID first seen after the baseline is not treated as "new" and
# its channel is not flagged. All other indicators still apply, so a cloned
# allow-listed BSSID is still caught.
known_bssids: []
#  - a4:2b:b0:11:22:33

# Alert messages (off by default; nothing is sent until you enable a channel).
# Never write passwords or tokens here: give the NAME of an environment variable.
notifications:
  enabled: false
  min_level: MEDIUM        # MEDIUM or HIGH
  realert_minutes: 30      # remind about an alert still active this long (0 = never)
  max_per_minute: 6        # per channel; extra messages are counted, not sent
  dashboard_url: ""        # e.g. http://kali.local:8050 (adds a link to each message)
  webhooks: []
#   - name: lab-receiver           # plain JSON POST, optionally signed:
#     url: http://127.0.0.1:9000/ghostap
#     format: json
#     secret_env: GHOSTAP_WEBHOOK_SECRET   # header X-GhostAP-Signature: sha256=<HMAC of the body>
#   - name: phone                  # https://ntfy.sh: install the app, pick a hard-to-guess topic
#     url_env: GHOSTAP_NTFY_URL    # export GHOSTAP_NTFY_URL=https://ntfy.sh/<your-topic>
#     format: ntfy
#     min_level: HIGH
#   - name: telegram               # bot token stays in the environment variable
#     url_env: GHOSTAP_TELEGRAM_URL   # https://api.telegram.org/bot<TOKEN>/sendMessage
#     format: telegram
#     chat_id: "123456789"
#   - name: slack
#     url_env: GHOSTAP_SLACK_URL
#     format: slack
  email:
    enabled: false
    host: ""               # e.g. smtp.gmail.com
    port: 587
    starttls: true
    username: ""
    password_env: GHOSTAP_SMTP_PASSWORD
    sender: ""
    to: []
  syslog:                  # for a SIEM: RFC 5424 lines, JSON or ArcSight CEF
    enabled: false
    host: 127.0.0.1
    port: 514
    protocol: udp          # udp or tcp
    format: json           # json or cef
  jsonl:                   # one JSON object per alert message, appended to a file
    enabled: false
    path: data/alerts.jsonl

# Prometheus / Grafana: GET /metrics (needs an API key when the dashboard is exposed).
api:
  metrics: true

# Opt-in AI help (alert explainer, "Ask GhostAP") through the Claude API. Off by default.
# Needs: pip install -r requirements-ai.txt, and ANTHROPIC_API_KEY in the environment.
# With redact: true, network names and addresses are replaced before anything is sent.
ai:
  enabled: false
  model: claude-opus-5-5
  effort: medium
  max_tokens: 16000
  redact: true

# Storage limits for long live captures.
retention:
  raw_hours: 0          # delete raw frames from the database after this many hours (0 = keep all)
  check_minutes: 10     # how often the limits are applied
  memory_minutes: 30    # recent history the detector keeps in RAM (0 = all); scores are unaffected
